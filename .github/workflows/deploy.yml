name: JAIOS Turd Eye Pipeline

on:
  push:
    branches: [ main ]
  # No base-branch filter: quality gates must run on every PR, including stacked
  # PRs whose base is another feature branch.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check scripts
        run: |
          python -m compileall -q scripts tests
          echo "✓ Python scripts compile cleanly"

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Confirm stdlib-only (NFR-01)
        run: |
          if [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "Dependency manifest found; NFR-01 requires stdlib-only scripts."
            exit 1
          fi
          echo "✓ No third-party dependency manifests — stdlib-only maintained"

      - name: Validate JSON configs and manifest
        run: |
          python -c "import json; json.load(open('configs/tools.json')); print('✓ tools.json is valid JSON')"
          python -c "import json; json.load(open('jaios.manifest.json')); print('✓ jaios.manifest.json is valid JSON')"

      - name: Headless CLI smoke test
        run: |
          export TEP_DATA_DIR="$(mktemp -d)"
          python scripts/cost_tracker.py add-expense --category Suno --amount 10 --description "CI smoke"
          python scripts/cost_tracker.py add-income --category Commission --amount 300 --description "CI smoke"
          python scripts/cost_tracker.py summary --json
          python scripts/rights_logger.py add --title "CI Smoke" --tool Suno --plan Pro --human-edits "ci"
          python scripts/rights_logger.py verify --strict
          python scripts/rights_logger.py export
          echo "✓ CLIs are operable headlessly (no TTY required)"

      - name: Check required architecture files
        run: |
          for f in AGENTS.md ARCHITECTURE.md README.md STRUCTURE.md LICENSE; do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f"
              exit 1
            fi
          done
          echo "✓ Core architecture files present"

  status:
    name: JAIOS Status
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deployment Summary
        run: |
          echo "✅ Turd Eye Productions pipeline passed"
          echo "Repo: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo "Type: Knowledge + Tooling (JAIOS module)"
          echo "Next: Update Notion JAIOS Command Center if needed"

      # Future: Notion sync via jenr8ed-deploy-kit
      # - name: Sync to Notion Command Center
      #   run: |
      #     # node path/to/sync-deployment.js ...
      #   env:
      #     NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
